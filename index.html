<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPilot AI — Your AI Study Companion</title>

  <!-- SEO -->
  <meta name="description" content="StudyPilot AI helps students plan, prioritize, and stay consistent with their study goals using AI-powered scheduling, daily streaks, and a built-in study assistant." />
  <meta name="theme-color" content="#0B1220" />

  <!-- Open Graph (LinkedIn, Facebook, WhatsApp link previews) -->
  <meta property="og:title" content="StudyPilot AI — Your AI Study Companion" />
  <meta property="og:description" content="Plan your goals, get AI-prioritized daily tasks, track your streak, and chat with an AI study assistant — all in one free app." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://studypilot-ai-lakshya.netlify.app/" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="StudyPilot AI — Your AI Study Companion" />
  <meta name="twitter:description" content="Plan your goals, get AI-prioritized daily tasks, track your streak, and chat with an AI study assistant." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Styles (order matters: variables first) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <div id="app-shell">
    <nav class="sidebar">
      <div class="sidebar__logo">StudyPilot AI</div>
      <button class="nav-tab active" data-screen="today">Today</button>
      <button class="nav-tab" data-screen="goals">Goals</button>
      <button class="nav-tab" data-screen="chat">Chat</button>
    </nav>

    <main class="main-content">
      <section id="screen-today" class="screen active">
        <div class="today-header">
          <h1 class="screen-title">Today</h1>
          <div id="streak-badge" class="streak-badge">🔥 0-day streak</div>
        </div>
        <div id="today-root"></div>
        <div id="heatmap-root"></div>
      </section>

      <section id="screen-goals" class="screen">
        <h1 class="screen-title">Goals</h1>
        <div id="goals-root"></div>
      </section>

      <section id="screen-chat" class="screen">
        <h1 class="screen-title">Chat</h1>
        <div id="chat-root"></div>
      </section>
    </main>
  </div>

  <footer class="app-footer">
    Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
  </footer>

  <!-- Load order matters: store.js (data) before ai.js before screen files before app.js (navigation/init) -->
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/today.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
