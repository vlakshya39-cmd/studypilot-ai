<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPilot AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Styles (order matters: variables first) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <div id="app-shell">
    <nav class="sidebar">
      <div class="sidebar__logo">StudyPilot AI</div>
      <button class="nav-tab active" data-screen="today">Today</button>
      <button class="nav-tab" data-screen="goals">Goals</button>
      <button class="nav-tab" data-screen="chat">Chat</button>
    </nav>

    <main class="main-content">
      <section id="screen-today" class="screen active">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--space-5);">
          <h1 class="screen-title" style="margin-bottom:0;">Today</h1>
          <div id="streak-badge" style="font-family:var(--font-mono); color:var(--amber); font-size:14px;">🔥 0-day streak</div>
        </div>
        <div id="today-root"></div>
        <div id="heatmap-root"></div>
      </section>

      <section id="screen-goals" class="screen">
        <h1 class="screen-title">Goals</h1>
        <div id="goals-root"></div>
      </section>

      <section id="screen-chat" class="screen">
        <h1 class="screen-title">Chat</h1>
        <div id="chat-root"></div>
      </section>
    </main>
  </div>

  <footer style="text-align:center; padding:var(--space-4); color:var(--text-muted); font-size:12px; border-top:1px solid var(--border); background:var(--bg-primary);">
    Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
  </footer>

  <!-- Load order matters: store.js (data) before ai.js before screen files before app.js (navigation/init) -->
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/today.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
